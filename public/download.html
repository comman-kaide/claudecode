<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Master - ダウンロード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f1f5f9;
        }

        .card {
            background: #1e293b;
            border-radius: 24px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 500px;
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #6366f1, #8b5cf6, #d946ef);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
        }

        p {
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: inline-block;
            padding: 18px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 16px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 40px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: #6366f1;
            border: 2px solid #6366f1;
        }

        .btn-secondary:hover {
            background: rgba(99, 102, 241, 0.1);
        }

        .features {
            margin-top: 30px;
            text-align: left;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 12px;
        }

        .features h3 {
            color: #8b5cf6;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .features ul {
            list-style: none;
            color: #94a3b8;
        }

        .features li {
            padding: 5px 0;
        }

        .features li::before {
            content: "✓ ";
            color: #10b981;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Typing Master</h1>
        <p>楽しいタイピングゲームで<br>タイピングスキルを磨こう!</p>

        <div class="buttons">
            <a href="typing-game.html" class="btn btn-primary">ゲームをプレイ</a>
            <a href="typing-game.html" download="typing-game.html" class="btn btn-secondary">HTMLファイルをダウンロード</a>
        </div>

        <div class="features">
            <h3>機能:</h3>
            <ul>
                <li>日本語・英語・ミックスモード</li>
                <li>3段階の難易度</li>
                <li>リアルタイムWPM計測</li>
                <li>コンボ&スコアシステム</li>
                <li>ランク評価 (S/A/B/C/D)</li>
            </ul>
        </div>
    </div>
</body>
</html>
