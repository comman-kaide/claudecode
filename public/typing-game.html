<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Master - 楽しいタイピングゲーム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1a2e 100%);
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 30px 0;
        }

        .header h1 {
            font-size: 3rem;
            background: linear-gradient(90deg, #6366f1, #8b5cf6, #d946ef);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 5px rgba(99, 102, 241, 0.5)); }
            to { filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.8)); }
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Menu Screen */
        .menu-screen {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .menu-section {
            margin-bottom: 30px;
        }

        .menu-section h3 {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-section h3::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(180deg, var(--primary), #8b5cf6);
            border-radius: 2px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
        }

        .option-btn {
            padding: 15px 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option-btn:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
            transform: translateY(-2px);
        }

        .option-btn.selected {
            border-color: var(--primary);
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.3), rgba(139, 92, 246, 0.3));
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
        }

        .start-btn {
            width: 100%;
            padding: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 40px rgba(99, 102, 241, 0.4);
        }

        .start-btn:active {
            transform: translateY(0);
        }

        /* Game Screen */
        .game-screen {
            display: none;
        }

        .game-screen.active {
            display: block;
        }

        .menu-screen.hidden {
            display: none;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(90deg, var(--primary), #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-card .label {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 5px;
        }

        .stat-card.timer .value {
            background: linear-gradient(90deg, var(--warning), #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-card.combo .value {
            background: linear-gradient(90deg, var(--success), #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Word Display */
        .word-display {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 25px;
            text-align: center;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .word-display.shake {
            animation: shake 0.5s ease-in-out;
            border-color: var(--error);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .word-display.success {
            animation: pulse 0.3s ease;
            border-color: var(--success);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .current-word {
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 15px;
        }

        .current-word .char {
            display: inline-block;
            transition: all 0.1s ease;
        }

        .current-word .char.correct {
            color: var(--success);
        }

        .current-word .char.incorrect {
            color: var(--error);
            text-decoration: underline;
        }

        .current-word .char.current {
            background: rgba(99, 102, 241, 0.3);
            border-radius: 4px;
            padding: 0 2px;
        }

        .reading {
            font-size: 1.5rem;
            color: var(--text-muted);
        }

        /* Input */
        .input-container {
            position: relative;
        }

        .typing-input {
            width: 100%;
            padding: 20px 25px;
            font-size: 1.5rem;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            background: var(--bg-card);
            color: var(--text);
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
            letter-spacing: 2px;
        }

        .typing-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.2);
        }

        .typing-input.error {
            border-color: var(--error);
            animation: inputShake 0.3s ease;
        }

        @keyframes inputShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Combo Display */
        .combo-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            font-weight: bold;
            pointer-events: none;
            opacity: 0;
            z-index: 1000;
        }

        .combo-popup.show {
            animation: comboPopup 0.8s ease-out forwards;
        }

        @keyframes comboPopup {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.5);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -100%) scale(1);
            }
        }

        /* Results Screen */
        .results-screen {
            display: none;
            text-align: center;
        }

        .results-screen.active {
            display: block;
        }

        .results-card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .results-title {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6, #d946ef);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .results-subtitle {
            color: var(--text-muted);
            margin-bottom: 40px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .result-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 16px;
        }

        .result-item .value {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary);
        }

        .result-item .label {
            color: var(--text-muted);
            margin-top: 5px;
        }

        .result-item.highlight {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(139, 92, 246, 0.2));
            border: 2px solid var(--primary);
        }

        .rank-display {
            font-size: 5rem;
            margin: 30px 0;
        }

        .rank-s { color: #ffd700; text-shadow: 0 0 30px rgba(255, 215, 0, 0.5); }
        .rank-a { color: #f472b6; text-shadow: 0 0 30px rgba(244, 114, 182, 0.5); }
        .rank-b { color: #60a5fa; text-shadow: 0 0 30px rgba(96, 165, 250, 0.5); }
        .rank-c { color: #4ade80; text-shadow: 0 0 30px rgba(74, 222, 128, 0.5); }
        .rank-d { color: #94a3b8; }

        .retry-btn {
            padding: 18px 50px;
            font-size: 1.3rem;
            font-weight: bold;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
        }

        .retry-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 40px rgba(99, 102, 241, 0.4);
        }

        .menu-btn {
            padding: 18px 50px;
            font-size: 1.3rem;
            font-weight: bold;
            border: 2px solid var(--primary);
            border-radius: 16px;
            background: transparent;
            color: var(--primary);
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
        }

        .menu-btn:hover {
            background: rgba(99, 102, 241, 0.1);
        }

        /* Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--primary);
            border-radius: 50%;
            opacity: 0.3;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-100vh) rotate(720deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .stats-bar {
                grid-template-columns: repeat(2, 1fr);
            }

            .current-word {
                font-size: 2rem;
            }

            .results-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="container">
        <header class="header">
            <h1>Typing Master</h1>
            <p>タイピングスキルを磨こう!</p>
        </header>

        <!-- Menu Screen -->
        <div class="menu-screen" id="menuScreen">
            <div class="menu-section">
                <h3>言語 / Language</h3>
                <div class="options-grid">
                    <button class="option-btn selected" data-option="language" data-value="japanese">日本語</button>
                    <button class="option-btn" data-option="language" data-value="english">English</button>
                    <button class="option-btn" data-option="language" data-value="mixed">ミックス</button>
                </div>
            </div>

            <div class="menu-section">
                <h3>難易度 / Difficulty</h3>
                <div class="options-grid">
                    <button class="option-btn" data-option="difficulty" data-value="easy">簡単</button>
                    <button class="option-btn selected" data-option="difficulty" data-value="normal">普通</button>
                    <button class="option-btn" data-option="difficulty" data-value="hard">難しい</button>
                </div>
            </div>

            <div class="menu-section">
                <h3>時間 / Time</h3>
                <div class="options-grid">
                    <button class="option-btn" data-option="time" data-value="30">30秒</button>
                    <button class="option-btn selected" data-option="time" data-value="60">60秒</button>
                    <button class="option-btn" data-option="time" data-value="120">120秒</button>
                </div>
            </div>

            <button class="start-btn" id="startBtn">ゲームスタート!</button>
        </div>

        <!-- Game Screen -->
        <div class="game-screen" id="gameScreen">
            <div class="stats-bar">
                <div class="stat-card timer">
                    <div class="value" id="timerDisplay">60</div>
                    <div class="label">残り時間</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="wpmDisplay">0</div>
                    <div class="label">WPM</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="accuracyDisplay">100%</div>
                    <div class="label">正確性</div>
                </div>
                <div class="stat-card combo">
                    <div class="value" id="comboDisplay">0</div>
                    <div class="label">コンボ</div>
                </div>
            </div>

            <div class="word-display" id="wordDisplay">
                <div class="current-word" id="currentWord"></div>
                <div class="reading" id="readingDisplay"></div>
            </div>

            <div class="input-container">
                <input type="text" class="typing-input" id="typingInput" placeholder="ここにタイプしてください..." autocomplete="off" autofocus>
            </div>
        </div>

        <!-- Results Screen -->
        <div class="results-screen" id="resultsScreen">
            <div class="results-card">
                <h2 class="results-title">ゲーム終了!</h2>
                <p class="results-subtitle">お疲れ様でした!</p>

                <div class="rank-display" id="rankDisplay">S</div>

                <div class="results-grid">
                    <div class="result-item highlight">
                        <div class="value" id="finalScore">0</div>
                        <div class="label">スコア</div>
                    </div>
                    <div class="result-item">
                        <div class="value" id="finalWpm">0</div>
                        <div class="label">WPM</div>
                    </div>
                    <div class="result-item">
                        <div class="value" id="finalAccuracy">0%</div>
                        <div class="label">正確性</div>
                    </div>
                    <div class="result-item">
                        <div class="value" id="finalWords">0</div>
                        <div class="label">完了単語数</div>
                    </div>
                    <div class="result-item">
                        <div class="value" id="maxCombo">0</div>
                        <div class="label">最大コンボ</div>
                    </div>
                    <div class="result-item">
                        <div class="value" id="totalChars">0</div>
                        <div class="label">タイプ文字数</div>
                    </div>
                </div>

                <button class="retry-btn" id="retryBtn">もう一度</button>
                <button class="menu-btn" id="menuBtn">メニューへ</button>
            </div>
        </div>
    </div>

    <div class="combo-popup" id="comboPopup"></div>

    <script>
        // Word Lists
        const wordLists = {
            japanese: {
                easy: [
                    { word: 'さくら', reading: 'sakura' },
                    { word: 'ねこ', reading: 'neko' },
                    { word: 'いぬ', reading: 'inu' },
                    { word: 'そら', reading: 'sora' },
                    { word: 'うみ', reading: 'umi' },
                    { word: 'やま', reading: 'yama' },
                    { word: 'かわ', reading: 'kawa' },
                    { word: 'はな', reading: 'hana' },
                    { word: 'ほし', reading: 'hoshi' },
                    { word: 'つき', reading: 'tuki' },
                    { word: 'あめ', reading: 'ame' },
                    { word: 'かぜ', reading: 'kaze' },
                    { word: 'ひ', reading: 'hi' },
                    { word: 'みず', reading: 'mizu' },
                    { word: 'き', reading: 'ki' },
                ],
                normal: [
                    { word: 'こんにちは', reading: 'konnnitiha' },
                    { word: 'ありがとう', reading: 'arigatou' },
                    { word: 'おはよう', reading: 'ohayou' },
                    { word: 'さようなら', reading: 'sayounara' },
                    { word: 'たいよう', reading: 'taiyou' },
                    { word: 'でんしゃ', reading: 'dennsya' },
                    { word: 'がっこう', reading: 'gakkou' },
                    { word: 'としょかん', reading: 'tosyokann' },
                    { word: 'びょういん', reading: 'byouinn' },
                    { word: 'えいが', reading: 'eiga' },
                    { word: 'おんがく', reading: 'onngaku' },
                    { word: 'りょこう', reading: 'ryokou' },
                    { word: 'しごと', reading: 'sigoto' },
                    { word: 'ともだち', reading: 'tomodati' },
                    { word: 'かぞく', reading: 'kazoku' },
                ],
                hard: [
                    { word: 'プログラミング', reading: 'puroguraminngu' },
                    { word: 'コンピューター', reading: 'konnpyu-ta-' },
                    { word: 'インターネット', reading: 'innta-netto' },
                    { word: 'アプリケーション', reading: 'apurike-syonn' },
                    { word: 'データベース', reading: 'de-tabe-su' },
                    { word: 'ソフトウェア', reading: 'sohutowea' },
                    { word: 'ハードウェア', reading: 'ha-dowea' },
                    { word: 'セキュリティ', reading: 'sekyuritei' },
                    { word: 'アルゴリズム', reading: 'arugorizumu' },
                    { word: 'インフラストラクチャ', reading: 'innhurasutorakutya' },
                ]
            },
            english: {
                easy: [
                    { word: 'cat', reading: '' },
                    { word: 'dog', reading: '' },
                    { word: 'sun', reading: '' },
                    { word: 'moon', reading: '' },
                    { word: 'star', reading: '' },
                    { word: 'tree', reading: '' },
                    { word: 'fish', reading: '' },
                    { word: 'bird', reading: '' },
                    { word: 'book', reading: '' },
                    { word: 'home', reading: '' },
                    { word: 'love', reading: '' },
                    { word: 'life', reading: '' },
                    { word: 'time', reading: '' },
                    { word: 'game', reading: '' },
                    { word: 'code', reading: '' },
                ],
                normal: [
                    { word: 'computer', reading: '' },
                    { word: 'keyboard', reading: '' },
                    { word: 'program', reading: '' },
                    { word: 'developer', reading: '' },
                    { word: 'function', reading: '' },
                    { word: 'variable', reading: '' },
                    { word: 'database', reading: '' },
                    { word: 'interface', reading: '' },
                    { word: 'algorithm', reading: '' },
                    { word: 'software', reading: '' },
                    { word: 'hardware', reading: '' },
                    { word: 'network', reading: '' },
                    { word: 'security', reading: '' },
                    { word: 'framework', reading: '' },
                    { word: 'component', reading: '' },
                ],
                hard: [
                    { word: 'implementation', reading: '' },
                    { word: 'authentication', reading: '' },
                    { word: 'infrastructure', reading: '' },
                    { word: 'microservices', reading: '' },
                    { word: 'containerization', reading: '' },
                    { word: 'orchestration', reading: '' },
                    { word: 'asynchronous', reading: '' },
                    { word: 'polymorphism', reading: '' },
                    { word: 'encapsulation', reading: '' },
                    { word: 'multithreading', reading: '' },
                ]
            }
        };

        // Game State
        let gameState = {
            language: 'japanese',
            difficulty: 'normal',
            timeLimit: 60,
            timer: 60,
            score: 0,
            wpm: 0,
            accuracy: 100,
            combo: 0,
            maxCombo: 0,
            wordsCompleted: 0,
            totalChars: 0,
            correctChars: 0,
            incorrectChars: 0,
            currentWord: null,
            currentTarget: '',
            isPlaying: false,
            timerInterval: null,
            startTime: null,
        };

        // DOM Elements
        const menuScreen = document.getElementById('menuScreen');
        const gameScreen = document.getElementById('gameScreen');
        const resultsScreen = document.getElementById('resultsScreen');
        const startBtn = document.getElementById('startBtn');
        const typingInput = document.getElementById('typingInput');
        const currentWordEl = document.getElementById('currentWord');
        const readingDisplay = document.getElementById('readingDisplay');
        const wordDisplay = document.getElementById('wordDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        const wpmDisplay = document.getElementById('wpmDisplay');
        const accuracyDisplay = document.getElementById('accuracyDisplay');
        const comboDisplay = document.getElementById('comboDisplay');
        const comboPopup = document.getElementById('comboPopup');
        const retryBtn = document.getElementById('retryBtn');
        const menuBtn = document.getElementById('menuBtn');

        // Initialize particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (15 + Math.random() * 10) + 's';
                particle.style.width = (5 + Math.random() * 10) + 'px';
                particle.style.height = particle.style.width;
                container.appendChild(particle);
            }
        }

        // Option selection
        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const option = btn.dataset.option;
                const value = btn.dataset.value;

                // Remove selected from siblings
                document.querySelectorAll(`[data-option="${option}"]`).forEach(b => {
                    b.classList.remove('selected');
                });

                btn.classList.add('selected');

                // Update game state
                if (option === 'language') gameState.language = value;
                if (option === 'difficulty') gameState.difficulty = value;
                if (option === 'time') gameState.timeLimit = parseInt(value);
            });
        });

        // Get random word
        function getRandomWord() {
            let words;

            if (gameState.language === 'mixed') {
                const lang = Math.random() > 0.5 ? 'japanese' : 'english';
                words = wordLists[lang][gameState.difficulty];
            } else {
                words = wordLists[gameState.language][gameState.difficulty];
            }

            return words[Math.floor(Math.random() * words.length)];
        }

        // Display word with character highlighting
        function displayWord() {
            gameState.currentWord = getRandomWord();

            if (gameState.language === 'japanese' || (gameState.language === 'mixed' && gameState.currentWord.reading)) {
                gameState.currentTarget = gameState.currentWord.reading;
                currentWordEl.textContent = gameState.currentWord.word;
                readingDisplay.textContent = gameState.currentWord.reading;
            } else {
                gameState.currentTarget = gameState.currentWord.word;
                currentWordEl.textContent = gameState.currentWord.word;
                readingDisplay.textContent = '';
            }

            updateWordDisplay('');
        }

        // Update word display with current input
        function updateWordDisplay(input) {
            const target = gameState.currentTarget;
            let html = '';

            for (let i = 0; i < target.length; i++) {
                let charClass = '';

                if (i < input.length) {
                    charClass = input[i] === target[i] ? 'correct' : 'incorrect';
                } else if (i === input.length) {
                    charClass = 'current';
                }

                html += `<span class="char ${charClass}">${target[i]}</span>`;
            }

            if (gameState.language === 'japanese' || (gameState.language === 'mixed' && gameState.currentWord.reading)) {
                currentWordEl.textContent = gameState.currentWord.word;
                readingDisplay.innerHTML = html;
            } else {
                currentWordEl.innerHTML = html;
                readingDisplay.textContent = '';
            }
        }

        // Show combo popup
        function showComboPopup(combo) {
            if (combo >= 5 && combo % 5 === 0) {
                comboPopup.textContent = `${combo} COMBO!`;
                comboPopup.style.background = `linear-gradient(90deg, hsl(${combo * 10}, 80%, 60%), hsl(${combo * 10 + 60}, 80%, 60%))`;
                comboPopup.style.webkitBackgroundClip = 'text';
                comboPopup.style.webkitTextFillColor = 'transparent';
                comboPopup.classList.remove('show');
                void comboPopup.offsetWidth; // Trigger reflow
                comboPopup.classList.add('show');
            }
        }

        // Calculate WPM
        function calculateWPM() {
            const elapsedMinutes = (Date.now() - gameState.startTime) / 60000;
            if (elapsedMinutes > 0) {
                gameState.wpm = Math.round((gameState.correctChars / 5) / elapsedMinutes);
            }
            return gameState.wpm;
        }

        // Calculate accuracy
        function calculateAccuracy() {
            const total = gameState.correctChars + gameState.incorrectChars;
            if (total > 0) {
                gameState.accuracy = Math.round((gameState.correctChars / total) * 100);
            }
            return gameState.accuracy;
        }

        // Update stats display
        function updateStats() {
            wpmDisplay.textContent = calculateWPM();
            accuracyDisplay.textContent = calculateAccuracy() + '%';
            comboDisplay.textContent = gameState.combo;
        }

        // Start game
        function startGame() {
            // Reset state
            gameState.timer = gameState.timeLimit;
            gameState.score = 0;
            gameState.wpm = 0;
            gameState.accuracy = 100;
            gameState.combo = 0;
            gameState.maxCombo = 0;
            gameState.wordsCompleted = 0;
            gameState.totalChars = 0;
            gameState.correctChars = 0;
            gameState.incorrectChars = 0;
            gameState.isPlaying = true;
            gameState.startTime = Date.now();

            // Update UI
            menuScreen.classList.add('hidden');
            resultsScreen.classList.remove('active');
            gameScreen.classList.add('active');

            timerDisplay.textContent = gameState.timer;
            typingInput.value = '';
            typingInput.focus();

            displayWord();
            updateStats();

            // Start timer
            gameState.timerInterval = setInterval(() => {
                gameState.timer--;
                timerDisplay.textContent = gameState.timer;

                if (gameState.timer <= 10) {
                    timerDisplay.style.color = '#ef4444';
                }

                if (gameState.timer <= 0) {
                    endGame();
                }
            }, 1000);
        }

        // End game
        function endGame() {
            gameState.isPlaying = false;
            clearInterval(gameState.timerInterval);

            // Calculate final score
            const baseScore = gameState.wordsCompleted * 100;
            const wpmBonus = gameState.wpm * 10;
            const accuracyBonus = Math.round(gameState.accuracy * 5);
            const comboBonus = gameState.maxCombo * 20;
            gameState.score = baseScore + wpmBonus + accuracyBonus + comboBonus;

            // Determine rank
            let rank, rankClass;
            if (gameState.score >= 5000) { rank = 'S'; rankClass = 'rank-s'; }
            else if (gameState.score >= 3000) { rank = 'A'; rankClass = 'rank-a'; }
            else if (gameState.score >= 2000) { rank = 'B'; rankClass = 'rank-b'; }
            else if (gameState.score >= 1000) { rank = 'C'; rankClass = 'rank-c'; }
            else { rank = 'D'; rankClass = 'rank-d'; }

            // Update results
            document.getElementById('rankDisplay').textContent = rank;
            document.getElementById('rankDisplay').className = `rank-display ${rankClass}`;
            document.getElementById('finalScore').textContent = gameState.score.toLocaleString();
            document.getElementById('finalWpm').textContent = gameState.wpm;
            document.getElementById('finalAccuracy').textContent = gameState.accuracy + '%';
            document.getElementById('finalWords').textContent = gameState.wordsCompleted;
            document.getElementById('maxCombo').textContent = gameState.maxCombo;
            document.getElementById('totalChars').textContent = gameState.correctChars;

            // Show results
            gameScreen.classList.remove('active');
            resultsScreen.classList.add('active');

            // Reset timer color
            timerDisplay.style.color = '';
        }

        // Handle input
        typingInput.addEventListener('input', (e) => {
            if (!gameState.isPlaying) return;

            const input = e.target.value;
            const target = gameState.currentTarget;

            updateWordDisplay(input);

            // Check each character
            if (input.length > 0) {
                const lastChar = input[input.length - 1];
                const targetChar = target[input.length - 1];

                if (lastChar === targetChar) {
                    gameState.correctChars++;
                    wordDisplay.classList.remove('shake');
                    typingInput.classList.remove('error');
                } else {
                    gameState.incorrectChars++;
                    gameState.combo = 0;
                    wordDisplay.classList.add('shake');
                    typingInput.classList.add('error');
                    setTimeout(() => {
                        wordDisplay.classList.remove('shake');
                        typingInput.classList.remove('error');
                    }, 500);
                }
            }

            // Word completed
            if (input === target) {
                gameState.wordsCompleted++;
                gameState.combo++;
                if (gameState.combo > gameState.maxCombo) {
                    gameState.maxCombo = gameState.combo;
                }

                showComboPopup(gameState.combo);
                wordDisplay.classList.add('success');
                setTimeout(() => wordDisplay.classList.remove('success'), 300);

                typingInput.value = '';
                displayWord();
            }

            updateStats();
        });

        // Prevent paste
        typingInput.addEventListener('paste', (e) => {
            e.preventDefault();
        });

        // Event listeners
        startBtn.addEventListener('click', startGame);
        retryBtn.addEventListener('click', startGame);
        menuBtn.addEventListener('click', () => {
            resultsScreen.classList.remove('active');
            menuScreen.classList.remove('hidden');
        });

        // Initialize
        createParticles();
    </script>
</body>
</html>
