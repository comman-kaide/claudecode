<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自動字幕生成アプリ | Auto Subtitle Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .upload-area:hover {
            background: #f0f2ff;
            border-color: #764ba2;
        }

        .upload-area.dragover {
            background: #e8ebff;
            border-color: #764ba2;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .upload-area h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.5em;
        }

        .upload-area p {
            color: #666;
            font-size: 1em;
        }

        #fileInput {
            display: none;
        }

        .file-info {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .file-info.show {
            display: block;
        }

        .file-name {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .progress-container {
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            height: 30px;
            margin-bottom: 10px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .status {
            text-align: center;
            color: #666;
            font-size: 0.95em;
        }

        .subtitle-preview {
            background: #f8f9ff;
            border: 1px solid #667eea;
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
            display: none;
            max-height: 400px;
            overflow-y: auto;
        }

        .subtitle-preview.show {
            display: block;
        }

        .subtitle-preview h3 {
            color: #667eea;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .subtitle-content {
            background: white;
            padding: 15px;
            border-radius: 5px;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }

        .spinner.show {
            display: block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-box {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .info-box strong {
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 自動字幕生成</h1>
            <p>動画をアップロードするだけで、AIが自動的に字幕を生成します</p>
        </div>

        <div class="content">
            <div class="info-box">
                <strong>使い方:</strong> 動画ファイル（MP4, AVI, MOV, MKV, WebM）をアップロードしてください。
                OpenAI Whisper APIを使用して、音声から字幕を自動生成します。
            </div>

            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📹</div>
                <h3>動画をアップロード</h3>
                <p>クリックしてファイルを選択、またはドラッグ＆ドロップ</p>
                <p style="margin-top: 10px; font-size: 0.9em; color: #999;">
                    対応フォーマット: MP4, AVI, MOV, MKV, WebM (最大100MB)
                </p>
            </div>

            <input type="file" id="fileInput" accept="video/*">

            <div class="file-info" id="fileInfo">
                <div class="file-name" id="fileName"></div>
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar">0%</div>
                </div>
                <div class="status" id="status">準備中...</div>
            </div>

            <div class="spinner" id="spinner"></div>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <div class="subtitle-preview" id="subtitlePreview">
                <h3>
                    <span>生成された字幕</span>
                    <button class="btn" id="downloadBtn" style="margin: 0;">ダウンロード</button>
                </h3>
                <div class="subtitle-content" id="subtitleContent"></div>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const progressBar = document.getElementById('progressBar');
        const status = document.getElementById('status');
        const spinner = document.getElementById('spinner');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const subtitlePreview = document.getElementById('subtitlePreview');
        const subtitleContent = document.getElementById('subtitleContent');
        const downloadBtn = document.getElementById('downloadBtn');

        let downloadUrl = '';

        // Click to upload
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // File selection
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');

            if (e.dataTransfer.files.length > 0) {
                const file = e.dataTransfer.files[0];
                if (file.type.startsWith('video/')) {
                    fileInput.files = e.dataTransfer.files;
                    handleFile(file);
                } else {
                    showError('動画ファイルをアップロードしてください');
                }
            }
        });

        async function handleFile(file) {
            hideMessages();
            fileName.textContent = `📁 ${file.name}`;
            fileInfo.classList.add('show');
            status.textContent = '動画をアップロード中...';
            progressBar.style.width = '0%';
            progressBar.textContent = '0%';

            const formData = new FormData();
            formData.append('video', file);

            try {
                const xhr = new XMLHttpRequest();

                // Progress tracking
                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        const percentComplete = Math.round((e.loaded / e.total) * 100);
                        progressBar.style.width = percentComplete + '%';
                        progressBar.textContent = percentComplete + '%';
                        status.textContent = `アップロード中... ${percentComplete}%`;
                    }
                });

                xhr.addEventListener('load', () => {
                    if (xhr.status === 200) {
                        const response = JSON.parse(xhr.responseText);
                        handleSuccess(response);
                    } else {
                        const error = JSON.parse(xhr.responseText);
                        showError(error.error || '処理に失敗しました');
                        fileInfo.classList.remove('show');
                    }
                    spinner.classList.remove('show');
                });

                xhr.addEventListener('error', () => {
                    showError('ネットワークエラーが発生しました');
                    fileInfo.classList.remove('show');
                    spinner.classList.remove('show');
                });

                xhr.open('POST', '/api/upload');
                xhr.send(formData);

                // Show processing status after upload
                xhr.upload.addEventListener('loadend', () => {
                    progressBar.style.width = '100%';
                    progressBar.textContent = '100%';
                    status.textContent = '音声を抽出中...';
                    spinner.classList.add('show');

                    setTimeout(() => {
                        status.textContent = 'AIで音声認識中... (数分かかる場合があります)';
                    }, 2000);
                });

            } catch (error) {
                showError('エラーが発生しました: ' + error.message);
                fileInfo.classList.remove('show');
                spinner.classList.remove('show');
            }
        }

        function handleSuccess(response) {
            status.textContent = '字幕生成完了!';
            showSuccess('字幕が正常に生成されました!');

            subtitleContent.textContent = response.subtitle;
            subtitlePreview.classList.add('show');
            downloadUrl = response.downloadUrl;

            setTimeout(() => {
                fileInfo.classList.remove('show');
            }, 2000);
        }

        downloadBtn.addEventListener('click', () => {
            if (downloadUrl) {
                window.location.href = downloadUrl;
            }
        });

        function showError(message) {
            errorMessage.textContent = '❌ ' + message;
            errorMessage.classList.add('show');
            successMessage.classList.remove('show');
        }

        function showSuccess(message) {
            successMessage.textContent = '✅ ' + message;
            successMessage.classList.add('show');
            errorMessage.classList.remove('show');
        }

        function hideMessages() {
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');
            subtitlePreview.classList.remove('show');
        }
    </script>
</body>
</html>
